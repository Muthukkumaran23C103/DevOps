[package]
name = "musicdb"
version = "0.1.0"
edition = "2021"
authors = ["DevOps Team"]
description = "Indian Music Catalog & Rating Server - Schema, Search & Metadata Integration"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
