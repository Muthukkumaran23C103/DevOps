# postgresql.conf tuned for low memory headroom on R3 box (4.4 GiB RAM total)

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory Configuration (Capped to prevent OS memory exhaustion)
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB
wal_buffers = 16MB

# Query Planner Configuration
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging & Monitoring
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries taking over 250ms

# Locale & Character Sets
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
